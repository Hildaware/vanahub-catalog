name: Setup catalog scanner
description: Install the pinned catalog scanner toolchain and check out its trusted source.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install pinned semantic scanner
      shell: bash
      run: python3 -m pip install --disable-pip-version-check --quiet semgrep==1.175.0
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: Hildaware/vanahub
        ref: 293155d5f7464be0c7184766ce7b71d822312157
        path: product
        persist-credentials: false
