name: Profile admission

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request created by trusted profile automation.
        required: true
        type: number
      expected_head_sha:
        description: Exact profile commit prepared by the upload workflow.
        required: true
        type: string

permissions: {}

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.review.state == 'approved'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      release_tag: ${{ steps.profile.outputs.release_tag }}
    steps:
      - name: Resolve and authenticate the exact generated PR
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          VH_INPUT_PR: ${{ inputs.pr_number }}
          VH_EVENT_PR: ${{ github.event.pull_request.number }}
          VH_INPUT_HEAD: ${{ inputs.expected_head_sha }}
          VH_REVIEWED_HEAD: ${{ github.event.review.commit_id }}
          VH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VH_PR="${VH_INPUT_PR:-$VH_EVENT_PR}"
          VH_EXPECTED_HEAD="${VH_INPUT_HEAD:-$VH_REVIEWED_HEAD}"
          [[ "$VH_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$VH_EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          details=$(gh pr view "$VH_PR" --repo "$VH_REPOSITORY" --json author,baseRefOid,headRefName,headRefOid,headRepositoryOwner)
          test "$(jq -r .author.login <<< "$details")" = app/github-actions
          test "$(jq -r .headRepositoryOwner.login <<< "$details")" = "${VH_REPOSITORY%%/*}"
          [[ "$(jq -r .headRefName <<< "$details")" == automation/profile/* ]]
          test "$(jq -r .headRefOid <<< "$details")" = "$VH_EXPECTED_HEAD"
          echo "pr_number=$VH_PR" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r .baseRefOid <<< "$details")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$VH_EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.context.outputs.base_sha }}
          path: catalog-base
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: d85cfa6083b0101ce637e386637ad115dcc2479c
          path: product
          persist-credentials: false
      - name: Extract and re-scan the exact draft artifact
        id: profile
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
          VH_PR: ${{ steps.context.outputs.pr_number }}
          VH_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$VH_REPOSITORY/pulls/$VH_PR/files" > changed.json
          python3 catalog-base/scripts/extract_profile_manifest.py changed.json "$VH_REPOSITORY" "$VH_HEAD_SHA" manifest.json
          python3 catalog-base/scripts/verify_profile_update.py manifest.json \
            --previous-root catalog-base/profiles --repository "$VH_REPOSITORY"
          id=$(jq -r .id manifest.json)
          version=$(jq -r .version manifest.json)
          tag="profile-$id-v$version"
          asset="$id-$version.vanahub-profile.zip"
          details=$(gh release view "$tag" --repo "$VH_REPOSITORY" --json isDraft,isPrerelease)
          test "$(jq -r .isDraft <<< "$details")" = true
          test "$(jq -r .isPrerelease <<< "$details")" = false
          mkdir artifact
          gh release download "$tag" --repo "$VH_REPOSITORY" --pattern "$asset" --dir artifact
          cmake -S product -B product/build/profile -DVH_BUILD_ENGINE=OFF -DVH_BUILD_TESTS=OFF
          cmake --build product/build/profile --target vanahub_settings_scan
          python3 product/tools/profile_scan.py verify manifest.json --archive "artifact/$asset" \
            --output report.json --settings-scanner product/build/profile/vanahub_settings_scan
          python3 catalog-base/scripts/render_profile_report.py report.json report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admitted-profile-report-${{ github.run_id }}
          path: |
            report.json
            report.md
          if-no-files-found: error
          retention-days: 7

  accept:
    needs: scan
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable exact-head merge while keeping the release private
        env:
          GH_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
          VH_PR: ${{ needs.scan.outputs.pr_number }}
          VH_HEAD_SHA: ${{ needs.scan.outputs.head_sha }}
          VH_TAG: ${{ needs.scan.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh pr merge "$VH_PR" --repo "$VH_REPOSITORY" --auto --squash --match-head-commit "$VH_HEAD_SHA"
          jq -n --argjson pr "$VH_PR" --arg head "$VH_HEAD_SHA" --arg release "$VH_TAG" \
            '{prNumber: $pr, headSha: $head, releaseTag: $release}' > admitted-change.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admitted-catalog-change
          path: admitted-change.json
          if-no-files-found: error
          retention-days: 1
