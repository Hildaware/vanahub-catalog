name: Discover VanaHub releases

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions: {}
concurrency:
  group: catalog-discovery
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, 'Check update:') && contains(github.event.issue.body, '### Repository URL') && contains(github.event.issue.body, '### Package ID'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned semantic scanner
        run: python3 -m pip install --disable-pip-version-check --quiet semgrep==1.175.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: d85cfa6083b0101ce637e386637ad115dcc2479c
          path: product
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-media-${{ hashFiles('requirements-media.txt', 'scripts/process_media.py') }}
      - run: python3 -m pip install --require-hashes --requirement requirements-media.txt
      - name: Discover, scan, normalize, and moderate updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            python3 scripts/discover_releases.py update --event "$GITHUB_EVENT_PATH" --packages-root packages --output-dir candidates
          else
            python3 scripts/discover_releases.py poll --packages-root packages --output-dir candidates
          fi
          mkdir -p cleanup scan-reports semantic-reports
          shopt -s nullglob
          for candidate in candidates/*.json; do
            id=$(jq -r .id "$candidate")
            cp "$candidate" "${candidate%.json}.source.json"
            python3 - "$id" "${candidate%.json}.source.json" <<'PY'
          import json, sys
          package_id, path = sys.argv[1:]
          source = json.load(open(path, encoding='utf-8'))
          base = 'https://vanahub-screenshot-upload.hildaware.workers.dev/'
          urls = [source.get('iconUrl'), *source.get('screenshots', [])]
          keys = [url.removeprefix(base) for url in urls if isinstance(url, str) and url.startswith(base)]
          json.dump({'keys': keys}, open(f'cleanup/{package_id}.json', 'w', encoding='utf-8'))
          PY
            set +e
            bash product/tools/scan_catalog_package.sh \
              "$candidate" "scan-reports/$id.json" reviews "semantic-reports/$id"
            scan_status=$?
            set -e
            if [[ "$scan_status" -eq 1 ]]; then
              rm -f "$candidate" "${candidate%.json}.source.json"
              continue
            fi
            test "$scan_status" -eq 0
            set +e
            python3 scripts/process_media.py "$candidate" "$candidate" \
              --media-root normalized-media \
              --public-base https://hildaware.github.io/vanahub-catalog/media \
              --previous-manifest "packages/$id/manifest.json" > media-error.txt 2>&1
            media_status=$?
            set -e
            if [[ "$media_status" -ne 0 ]]; then
              python3 - "scan-reports/$id.json" media-error.txt <<'PY'
          import json, sys
          report_path, error_path = sys.argv[1:]
          with open(report_path, encoding='utf-8') as handle:
              report = json.load(handle)
          with open(error_path, encoding='utf-8', errors='replace') as handle:
              message = handle.read()[-4000:].strip() or 'Media normalization or moderation failed.'
          report['accepted'] = False
          report.setdefault('findings', []).append({
              'capability': None,
              'line': None,
              'message': message,
              'path': None,
              'rule': 'media.processing',
              'severity': 'error',
          })
          with open(report_path, 'w', encoding='utf-8') as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY
              rm -f "$candidate" "${candidate%.json}.source.json" media-error.txt
              continue
            fi
            rm -f media-error.txt
            done
          rm -f candidates/*.source.json
          find candidates cleanup normalized-media scan-reports semantic-reports -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum > validated.sha256 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-discovery-${{ github.run_id }}
          path: |
            candidates
            cleanup
            normalized-media
            scan-reports
            semantic-reports
            validated.sha256
          if-no-files-found: error
          retention-days: 1

  write:
    needs: validate
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-discovery-${{ github.run_id }}
          path: validated
      - name: Open audited update PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd validated
          if test -s validated.sha256; then sha256sum --check validated.sha256; fi
          cd ..
          gh auth setup-git
          mkdir -p validated/prepared-prs
          shopt -s nullglob
          for candidate in validated/candidates/*.json; do
            id=$(jq -r .id "$candidate")
            version=$(jq -r .version "$candidate")
            [[ "$id" =~ ^[a-z0-9][a-z0-9._-]{1,63}$ ]]
            branch="automation/${id}/${version}"
            number=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
            if [[ -n "$number" ]]; then
              echo "$number" > "validated/prepared-prs/$id"
              continue
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -C "$branch" origin/main
            mkdir -p "packages/$id"
            cp "$candidate" "packages/$id/manifest.json"
            if test -d "validated/normalized-media/$id"; then mkdir -p "media/$id"; cp validated/normalized-media/$id/*.jpg "media/$id/"; fi
            git add "packages/$id/manifest.json"
            if test -d "media/$id"; then git add "media/$id"; fi
            if git diff --cached --quiet; then git switch main; continue; fi
            git commit -m "Publish $id $version"
            head_sha=$(git rev-parse HEAD)
            git push --force-with-lease --set-upstream origin "$branch"
            url=$(gh pr create --base main --head "$branch" --title "Publish $id $version" --body "Automatically discovered from an authorized stable GitHub Release.")
            number=$(gh pr view "$url" --json number --jq .number)
            echo "$number" > "validated/prepared-prs/$id"
            if [[ "${{ github.event_name }}" == "issues" ]]; then
              gh issue comment "${{ github.event.issue.number }}" --body "Prepared catalog PR #${number}. Admission is re-verifying the release and normalized media."
            fi
            gh workflow run admission.yml --ref main -f pr_number="$number" -f expected_head_sha="$head_sha"
            git switch main
          done
      - name: Report release scans to originating submission issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for report in validated/scan-reports/*.json; do
            id=$(jq -r .packageId "$report")
            provenance="packages/$id/provenance.json"
            if [[ ! -f "$provenance" ]]; then
              echo "warning: $id has no submission provenance; scan report was not posted"
              continue
            fi
            pr=""
            if [[ -f "validated/prepared-prs/$id" ]]; then pr=$(<"validated/prepared-prs/$id"); fi
            args=()
            if [[ -n "$pr" ]]; then args+=(--pull-request "$pr"); fi
            python3 scripts/post_scan_report.py "$report" "$provenance" \
              --repository "${{ github.repository }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "${args[@]}"
          done
      - name: Best-effort staged media cleanup
        continue-on-error: true
        env:
          VH_CLEANUP_SECRET: ${{ secrets.VANAHUB_MEDIA_CLEANUP_SECRET }}
          VH_CLEANUP_URL: ${{ vars.VANAHUB_SCREENSHOT_UPLOAD_URL }}
        run: |
          set -euo pipefail
          test -n "$VH_CLEANUP_SECRET"
          shopt -s nullglob
          for request in validated/cleanup/*.json; do
            test "$(jq '.keys | length' "$request")" -eq 0 && continue
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VH_CLEANUP_SECRET" \
              -H 'Content-Type: application/json' --data @"$request" \
              "${VH_CLEANUP_URL%/}/cleanup"
          done

  notify-failure:
    needs: validate
    if: always() && github.event_name == 'issues' && needs.validate.result == 'failure'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Update discovery, validation, or media moderation failed. Review the workflow log and publish or upload corrected inputs before reopening this issue."
