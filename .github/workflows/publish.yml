name: Publish signed catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile_release_tag:
        description: Optional draft profile release to finalize after validating its merged manifest.
        required: false
        type: string
  # Catalog automation merges with GITHUB_TOKEN, so its resulting push does
  # not start another workflow. Publish after successful admission as the
  # explicit handoff for those merges.
  workflow_run:
    workflows: [Catalog admission, Profile admission]
    types: [completed]

permissions: {}

concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      profile_release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event_name == 'workflow_run'
        with:
          name: admitted-catalog-change
          path: admitted
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Wait for the exact admitted change to merge
        id: admitted
        if: github.event_name == 'workflow_run'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(jq -r .prNumber admitted/admitted-change.json)
          expected_head=$(jq -r .headSha admitted/admitted-change.json)
          [[ "$pr" =~ ^[0-9]+$ ]]
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]]
          for attempt in {1..24}; do
            details=$(gh pr view "$pr" --repo "$VH_REPOSITORY" --json headRefOid,state)
            test "$(jq -r .headRefOid <<< "$details")" = "$expected_head"
            state=$(jq -r .state <<< "$details")
            if [[ "$state" == "MERGED" ]]; then exit 0; fi
            if [[ "$state" != "OPEN" ]]; then exit 1; fi
            sleep 5
          done
          echo "admitted PR #$pr did not merge before publication timeout" >&2
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: catalog
          persist-credentials: false
      - uses: ./catalog/.github/actions/setup-catalog-scanner
      - id: distro-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VANAHUB_DISTRIBUTOR_APP_ID }}
          private-key: ${{ secrets.VANAHUB_DISTRIBUTOR_APP_PRIVATE_KEY }}
          owner: Hildaware
          repositories: vanahub-addon-distro
      - name: Re-scan and build unsigned index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.distro-token.outputs.token }}
        run: |
          set -euo pipefail
          cmake -S product -B product/build/profile -DVH_BUILD_ENGINE=OFF -DVH_BUILD_TESTS=OFF
          cmake --build product/build/profile --target vanahub_settings_scan
          mkdir -p publish-scan-reports semantic-publish distro-review-cache
          shopt -s nullglob
          manifests=(catalog/packages/*/manifest.json)
          for manifest in "${manifests[@]}"; do
            if [[ "$(jq -r .id "$manifest")" == "vanahub" ]]; then
              test "$(jq -r .sourceUrl "$manifest" | tr '[:upper:]' '[:lower:]' | sed 's:/*$::')" = "https://github.com/hildaware/vanahub"
            fi
            id=$(jq -er .id "$manifest")
            scan_manifest="$manifest"
            provenance="catalog/packages/$id/provenance.json"
            review_root="catalog/reviews"
            is_distro_handoff=false
            if [[ -f "$provenance" && "$(jq -r '.distributorRepository // empty' "$provenance")" == "https://github.com/Hildaware/vanahub-addon-distro" ]]; then
              is_distro_handoff=true
            fi
            if [[ "$is_distro_handoff" == true ]]; then
              distro_commit=$(jq -er .distroCommit "$provenance")
              [[ "$distro_commit" =~ ^[0-9a-f]{40}$ ]]
              checkout="distro-review-cache/$distro_commit"
              if [[ ! -d "$checkout/.git" ]]; then
                gh repo clone Hildaware/vanahub-addon-distro "$checkout" -- --quiet --no-checkout --filter=blob:none
                git -C "$checkout" remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Hildaware/vanahub-addon-distro.git"
                git -C "$checkout" checkout --quiet --detach "$distro_commit"
              fi
              version=$(jq -er .version "$manifest")
              candidate="$checkout/packages/$id/releases/$version.json"
              test -f "$candidate"
              review_root="distro-review-cache/reviews-$id"
              mkdir -p "$review_root" "publish-scan-reports/attestations"
              python3 catalog/scripts/community_distribution.py audit \
                --candidate "$candidate" --manifest "$manifest" --provenance "$provenance" \
                --semantic-baseline "$review_root/$id.json" \
                --semantic-attestation "publish-scan-reports/attestations/$id.json"
            fi
            scan_args=("$scan_manifest" "publish-scan-reports/$id.json" "$review_root" "semantic-publish/$id")
            if [[ "$is_distro_handoff" == true ]]; then scan_args+=("$provenance"); fi
            set +e
            bash product/tools/scan_catalog_package.sh "${scan_args[@]}"
            scan_status=$?
            set -e
            if (( scan_status != 0 )) && [[ "$is_distro_handoff" == true && -s "semantic-publish/$id/semantic-review.json" ]]; then
              attestation="publish-scan-reports/attestations/$id.json"
              scanner_revision=$(git -C product rev-parse HEAD)
              policy_sha=$(sha256sum product/policy/semgrep-lua.yml | cut -d' ' -f1)
              semgrep_version=$(semgrep --version | head -n 1)
              drift=false
              if [[ "$(jq -r .schemaVersion "$attestation")" == 1 ]]; then
                drift=true
              elif [[ "$(jq -r .scanner.revision "$attestation")" != "$scanner_revision" || \
                      "$(jq -r .scanner.policySha256 "$attestation")" != "$policy_sha" || \
                      "$(jq -r .scanner.semgrepVersion "$attestation")" != "$semgrep_version" ]]; then
                drift=true
              fi
              jq -n --argjson policyDrift "$drift" --arg scannerRevision "$scanner_revision" \
                --arg policySha256 "$policy_sha" --arg semgrepVersion "$semgrep_version" \
                '{policyDrift: $policyDrift, currentScanner: {revision: $scannerRevision, policySha256: $policySha256, semgrepVersion: $semgrepVersion}}' \
                > "publish-scan-reports/$id.scanner-drift.json"
              if [[ "$drift" == true ]]; then
                echo "Scanner drift retained for $id." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Semantic findings retained for $id and do not block publication." >> "$GITHUB_STEP_SUMMARY"
              fi
            elif (( scan_status != 0 )); then
              exit "$scan_status"
            fi
          done
          profile_manifests=(catalog/profiles/*/manifest.json)
          for manifest in "${profile_manifests[@]}"; do
            python3 product/tools/profile_scan.py verify "$manifest" --output /tmp/profile-report.json \
              --settings-scanner product/build/profile/vanahub_settings_scan
          done
          python3 product/tools/build_catalog.py catalog/packages public \
            --revocations catalog/revocations.json --unsigned
          if test -d catalog/media; then cp -R catalog/media public/media; fi
          test -s public/index.json
      - name: Preserve failed publication scans
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rejected-publication-scans
          path: |
            publish-scan-reports
            semantic-publish
          retention-days: 90
      - name: Resolve an admitted profile release
        id: release
        env:
          VH_INPUT_TAG: ${{ inputs.profile_release_tag }}
          VH_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="$VH_INPUT_TAG"
          if [[ "$VH_EVENT_NAME" == "workflow_run" ]]; then
            tag=$(jq -r '.releaseTag // empty' admitted/admitted-change.json)
          fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^profile-[a-z0-9][a-z0-9._-]{1,63}-v.+$ ]]
            matched=false
            shopt -s nullglob
            for manifest in catalog/profiles/*/manifest.json; do
              id=$(jq -r .id "$manifest")
              version=$(jq -r .version "$manifest")
              if [[ "$tag" == "profile-$id-v$version" ]]; then matched=true; break; fi
            done
            test "$matched" = true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-catalog
          path: public
          if-no-files-found: error
          retention-days: 90

  publish-profile-release:
    needs: [validate, sign]
    if: needs.validate.outputs.profile_release_tag != '' && needs.sign.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: profile-publishing
    steps:
      - name: Publish the validated profile release
        env:
          GH_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
          VH_TAG: ${{ needs.validate.outputs.profile_release_tag }}
        run: |
          set -euo pipefail
          details=$(gh release view "$VH_TAG" --repo "$VH_REPOSITORY" --json isDraft,isPrerelease)
          test "$(jq -r .isDraft <<< "$details")" = true
          test "$(jq -r .isPrerelease <<< "$details")" = false
          gh release edit "$VH_TAG" --repo "$VH_REPOSITORY" --draft=false --latest=false

  sign:
    needs: validate
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: 0134d271197ca7d2a9cb1d59019cc840c329baa0
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-catalog
          path: public
      - name: Sign validated index
        env:
          VANAHUB_ED25519_PRIVATE_KEY: ${{ secrets.VANAHUB_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VANAHUB_ED25519_PRIVATE_KEY:-}"
          python3 product/tools/build_catalog.py . public --sign-only
          test -s public/index.json.sig
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: [sign, publish-profile-release]
    if: always() && needs.sign.result == 'success' && (needs.publish-profile-release.result == 'success' || needs.publish-profile-release.result == 'skipped')
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  reconcile-community-distributions:
    needs: deploy
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Close published handoff issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create published --color 1a7f37 --description 'Artifact is present in the deployed catalog' --force
          shopt -s nullglob
          for provenance in packages/*/provenance.json; do
            [[ "$(jq -r '.distributorRepository // empty' "$provenance")" == "https://github.com/Hildaware/vanahub-addon-distro" ]] || continue
            issue=$(jq -er .catalogSubmissionIssue "$provenance")
            id=$(jq -er .packageId "$provenance")
            manifest="packages/$id/manifest.json"
            version=$(jq -er .version "$manifest")
            sha=$(jq -er .sha256 "$manifest")
            if gh issue view "$issue" --json labels --jq '.labels[].name' | grep -Fxq published; then
              continue
            fi
            gh issue edit "$issue" --add-label published --remove-label 'catalog:prepared' --remove-label 'catalog:admitted' --remove-label 'handoff:pending' || true
            gh issue comment "$issue" --body "Published \`$id $version\` to the catalog with artifact SHA-256 \`$sha\`."
            gh issue close "$issue" --reason completed || true
          done
