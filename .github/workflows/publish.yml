name: Publish signed catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Catalog automation merges with GITHUB_TOKEN, so its resulting push does
  # not start another workflow. Publish after successful admission as the
  # explicit handoff for those merges.
  workflow_run:
    workflows: [Catalog admission, Profile admission]
    types: [completed]

permissions: {}

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event_name == 'workflow_run'
        with:
          name: admitted-catalog-change
          path: admitted
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Wait for the exact admitted change to merge
        if: github.event_name == 'workflow_run'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(jq -r .prNumber admitted/admitted-change.json)
          expected_head=$(jq -r .headSha admitted/admitted-change.json)
          [[ "$pr" =~ ^[0-9]+$ ]]
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]]
          for attempt in {1..24}; do
            details=$(gh pr view "$pr" --repo "$VH_REPOSITORY" --json headRefOid,state)
            test "$(jq -r .headRefOid <<< "$details")" = "$expected_head"
            state=$(jq -r .state <<< "$details")
            if [[ "$state" == "MERGED" ]]; then exit 0; fi
            if [[ "$state" != "OPEN" ]]; then exit 1; fi
            sleep 5
          done
          echo "admitted PR #$pr did not merge before publication timeout" >&2
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: catalog
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: fe5a9d5c81d43c6677b705d2a7950b6a8cac03bf
          path: product
          persist-credentials: false
      - name: Re-scan and build unsigned index
        run: |
          set -euo pipefail
          cmake -S product -B product/build/profile -DVH_BUILD_ENGINE=OFF -DVH_BUILD_TESTS=OFF
          cmake --build product/build/profile --target vanahub_settings_scan
          shopt -s nullglob
          manifests=(catalog/packages/*/manifest.json)
          for manifest in "${manifests[@]}"; do
            if [[ "$(jq -r .id "$manifest")" == "vanahub" ]]; then
              test "$(jq -r .sourceUrl "$manifest" | tr '[:upper:]' '[:lower:]' | sed 's:/*$::')" = "https://github.com/hildaware/vanahub"
            fi
            python3 product/tools/catalog_scan.py "$manifest" --output /tmp/scan-report.json
          done
          profile_manifests=(catalog/profiles/*/manifest.json)
          for manifest in "${profile_manifests[@]}"; do
            python3 product/tools/profile_scan.py verify "$manifest" --output /tmp/profile-report.json \
              --settings-scanner product/build/profile/vanahub_settings_scan
          done
          python3 product/tools/build_catalog.py catalog/packages public \
            --revocations catalog/revocations.json --unsigned
          if test -d catalog/media; then cp -R catalog/media public/media; fi
          test -s public/index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-catalog
          path: public
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: validate
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: fe5a9d5c81d43c6677b705d2a7950b6a8cac03bf
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-catalog
          path: public
      - name: Sign validated index
        env:
          VANAHUB_ED25519_PRIVATE_KEY: ${{ secrets.VANAHUB_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VANAHUB_ED25519_PRIVATE_KEY:-}"
          python3 product/tools/build_catalog.py . public --sign-only
          test -s public/index.json.sig
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: sign
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
