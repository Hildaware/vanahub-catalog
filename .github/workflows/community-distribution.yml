name: Prepare community distribution candidate

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing trusted handoff issue to retry
        required: true
        type: number

permissions: {}

concurrency:
  group: community-distribution-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'community-distribution')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    outputs:
      issue: ${{ steps.context.outputs.issue }}
      artifact_sha: ${{ steps.context.outputs.artifact_sha }}
      policy_drift: ${{ steps.scan.outputs.policy_drift }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve trusted handoff issue
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${INPUT_ISSUE}" | jq '{issue: .}' > issue-event.json
          else
            cp "$GITHUB_EVENT_PATH" issue-event.json
          fi
          jq -e '.issue.labels | map(.name) | contains(["community-distribution"])' issue-event.json >/dev/null
      - id: context
        name: Validate App-authored handoff envelope
        env:
          VH_DISTRIBUTOR_APP: ${{ vars.VANAHUB_DISTRIBUTOR_APP_LOGIN }}
        run: |
          set -euo pipefail
          test -n "$VH_DISTRIBUTOR_APP"
          python3 scripts/community_distribution.py context --event issue-event.json \
            --expected-author "$VH_DISTRIBUTOR_APP" --output handoff.json
          echo "value=$(jq -c . handoff.json)" >> "$GITHUB_OUTPUT"
          echo "issue=$(jq -r .catalogIssue handoff.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$(jq -r .sha256 handoff.json)" >> "$GITHUB_OUTPUT"
      - id: distro-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VANAHUB_DISTRIBUTOR_APP_ID }}
          private-key: ${{ secrets.VANAHUB_DISTRIBUTOR_APP_PRIVATE_KEY }}
          owner: Hildaware
          repositories: vanahub-addon-distro
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Hildaware/vanahub-addon-distro
          ref: ${{ fromJSON(steps.context.outputs.value).distroCommit }}
          path: distro
          token: ${{ steps.distro-token.outputs.token }}
          fetch-depth: 0
      - name: Ensure exact candidate commit is on distro main
        env:
          VH_COMMIT: ${{ fromJSON(steps.context.outputs.value).distroCommit }}
        run: |
          set -euo pipefail
          git -C distro fetch --no-tags origin main
          git -C distro merge-base --is-ancestor "$VH_COMMIT" origin/main
      - name: Extract and bind trusted candidate
        env:
          VH_PATH: ${{ fromJSON(steps.context.outputs.value).candidatePath }}
        run: |
          set -euo pipefail
          python3 scripts/community_distribution.py prepare --candidate "distro/$VH_PATH" \
            --handoff handoff.json --manifest manifest.json --provenance provenance.json \
            --semantic-baseline distro-semantic-baseline.json \
            --semantic-attestation distro-semantic-attestation.json
      - uses: ./.github/actions/setup-catalog-scanner
      - id: scan
        name: Independently re-scan trusted artifact
        run: |
          set -euo pipefail
          python3 product/tools/catalog_scan.py manifest.json --provenance provenance.json \
            --output scan-report.json --archive-output package.zip
          mkdir -p semantic-review distro-reviews
          package_id=$(jq -er .id manifest.json)
          cp distro-semantic-baseline.json "distro-reviews/$package_id.json"
          scanner_revision=$(git -C product rev-parse HEAD)
          policy_sha=$(sha256sum product/policy/semgrep-lua.yml | cut -d' ' -f1)
          semgrep_version=$(semgrep --version | head -n 1)
          attested_revision=$(jq -r '.scanner.revision // empty' distro-semantic-attestation.json)
          attested_policy=$(jq -r '.scanner.policySha256 // empty' distro-semantic-attestation.json)
          attested_semgrep=$(jq -r '.scanner.semgrepVersion // empty' distro-semantic-attestation.json)
          policy_drift=false
          if [[ "$(jq -r .schemaVersion distro-semantic-attestation.json)" == 1 ]]; then
            policy_drift=true
          fi
          if [[ -n "$attested_revision" && ( "$scanner_revision" != "$attested_revision" || "$policy_sha" != "$attested_policy" || "$semgrep_version" != "$attested_semgrep" ) ]]; then
            policy_drift=true
          fi
          set +e
          python3 product/tools/semantic_scan.py --semgrep "$(command -v semgrep)" \
            --rules product/policy/semgrep-lua.yml --archive package.zip \
            --archive-root "$(jq -er .archiveRoot manifest.json)" --package-id "$package_id" \
            --output-directory semantic-review --catalog-report scan-report.json \
            --baseline "distro-reviews/$package_id.json"
          semantic_status=$?
          set -e
          jq -n --argjson drift "$policy_drift" --arg scannerRevision "$scanner_revision" \
            --arg policySha256 "$policy_sha" --arg semgrepVersion "$semgrep_version" \
            '{policyDrift: $drift, currentScanner: {revision: $scannerRevision, policySha256: $policySha256, semgrepVersion: $semgrepVersion}}' > scanner-drift.json
          echo "policy_drift=$policy_drift" >> "$GITHUB_OUTPUT"
          if (( semantic_status != 0 )) && [[ ! -s semantic-review/semantic-review.json ]]; then
            exit "$semantic_status"
          fi
          if (( semantic_status != 0 )); then
            echo 'Semantic findings are retained for audit and do not block the trusted distro candidate.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validated-community-distribution-${{ github.run_id }}
          path: |
            handoff.json
            manifest.json
            provenance.json
            distro-semantic-baseline.json
            distro-semantic-attestation.json
            scanner-drift.json
            scan-report.json
            semantic-review
          if-no-files-found: warn
          retention-days: 90

  write:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-community-distribution-${{ github.run_id }}
          path: validated
      - name: Preflight repository automation settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions | select(.push == true)' >/dev/null
      - name: Open idempotent audited catalog PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          ARTIFACT_SHA: ${{ needs.validate.outputs.artifact_sha }}
          POLICY_DRIFT: ${{ needs.validate.outputs.policy_drift }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          id=$(jq -er .id validated/manifest.json)
          version=$(jq -er .version validated/manifest.json)
          branch="automation/$id/$version/${ARTIFACT_SHA:0:12}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch" origin/main
          mkdir -p "packages/$id" reviews
          cp validated/manifest.json "packages/$id/manifest.json"
          cp validated/provenance.json "packages/$id/provenance.json"
          cp validated/distro-semantic-baseline.json "reviews/$id.json"
          git add "packages/$id/manifest.json" "packages/$id/provenance.json" "reviews/$id.json"
          if ! git diff --cached --quiet; then
            git commit -m "Publish $id $version"
            git push --force-with-lease --set-upstream origin "$branch"
          fi
          pr=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create --base main --head "$branch" --title "Publish $id $version" \
              --body "Trusted community-distribution handoff #$ISSUE. Artifact SHA-256: $ARTIFACT_SHA.")
            pr=$(gh pr view "$url" --json number --jq .number)
          fi
          head_sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run admission.yml --ref main -f pr_number="$pr" -f expected_head_sha="$head_sha"
          gh label create 'catalog:prepared' --color 8250df --description 'Catalog candidate prepared for exact-head admission' --force
          gh issue edit "$ISSUE" --add-label 'catalog:prepared' --remove-label 'catalog:admitted' --remove-label 'handoff:pending' --remove-label 'review:failed' || true
          gh issue comment "$ISSUE" --body "Catalog preparation passed for \`$id $version\` (artifact \`$ARTIFACT_SHA\`, policy drift: \`$POLICY_DRIFT\`). Prepared PR #$pr and dispatched exact-head admission at \`$head_sha\`."

  notify-failure:
    needs: validate
    if: always() && needs.validate.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Report admission failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.validate.outputs.issue || inputs.issue_number || github.event.issue.number }}
        run: |
          gh label create 'review:failed' --repo "$GITHUB_REPOSITORY" --color d1242f --description 'Admission requires operator review' --force
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label 'review:failed' --remove-label 'catalog:prepared' --remove-label 'catalog:admitted' || true
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Catalog admission failed. Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
