name: Prepare initial catalog submission

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  submit:
    if: startsWith(github.event.issue.title, 'Add package:') && contains(github.event.issue.body, '### Repository URL') && contains(github.event.issue.body, '### Package ID')
    runs-on: ubuntu-latest
    steps:
      - name: Track catalog submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create vanahub-submission --repo "${{ github.repository }}" --color 1f6feb --description "VanaHub catalog admission request" --force
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label vanahub-submission
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: a98faa0583380ccc2cfde4072453bcd7b61a7119
          path: product
          persist-credentials: false
      - name: Discover authorized release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_releases.py initial --event "$GITHUB_EVENT_PATH" --output candidate.json
      - name: Validate candidate
        run: python3 product/tools/catalog_scan.py candidate.json --output scan-report.json
      - name: Open audited manifest PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          id=$(jq -r .id candidate.json)
          version=$(jq -r .version candidate.json)
          branch="automation/${id}/${version}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch" origin/main
          mkdir -p "packages/$id"
          cp candidate.json "packages/$id/manifest.json"
          git add "packages/$id/manifest.json"
          if git diff --cached --quiet; then
            gh issue comment "${{ github.event.issue.number }}" --body "The catalog already contains $id $version. Future stable releases will be discovered automatically."
            exit 0
          fi
          git commit -m "Publish $id $version"
          git push --force-with-lease --set-upstream origin "$branch"
          number=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            if ! url=$(gh pr create --base main --head "$branch" --title "Publish $id $version" --body "Automated from #${{ github.event.issue.number }} after source authorization and artifact validation."); then
              compare="https://github.com/${{ github.repository }}/compare/main...${branch}?expand=1"
              message="The validated catalog branch is ready, but this repository does not allow Actions to create pull requests. [Open the prepared catalog PR](${compare})."
              gh issue comment "${{ github.event.issue.number }}" --body "$message"
              printf '## Finish submission\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            number=$(gh pr view "$url" --json number --jq .number)
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh issue comment "${{ github.event.issue.number }}" --body "Prepared catalog PR #${number}. Admission will re-verify the release before merge."
      - name: Dispatch admission
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh workflow run admission.yml --ref main -f pr_number="$PR_NUMBER"
