name: Prepare initial catalog submission

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: startsWith(github.event.issue.title, 'Add package:') && contains(github.event.issue.body, '### Repository URL') && contains(github.event.issue.body, '### Package ID')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: fe5a9d5c81d43c6677b705d2a7950b6a8cac03bf
          path: product
          persist-credentials: false
      - name: Cache pinned media dependencies and model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-media-${{ hashFiles('requirements-media.txt', 'scripts/process_media.py') }}
      - name: Install pinned media stack
        run: python3 -m pip install --require-hashes --requirement requirements-media.txt
      - name: Discover and scan authorized release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/discover_releases.py initial --event "$GITHUB_EVENT_PATH" --output candidate.json
          python3 product/tools/catalog_scan.py candidate.json --output scan-report.json
      - name: Normalize and moderate untrusted media
        run: |
          set -euo pipefail
          cp candidate.json source-candidate.json
          python3 scripts/process_media.py candidate.json candidate.json \
            --media-root normalized-media \
            --public-base https://hildaware.github.io/vanahub-catalog/media
          python3 - "${{ github.event.issue.number }}" <<'PY'
          import json, sys
          source = json.load(open('source-candidate.json', encoding='utf-8'))
          base = 'https://vanahub-screenshot-upload.hildaware.workers.dev/'
          urls = [source.get('iconUrl'), *source.get('screenshots', [])]
          keys = [url.removeprefix(base) for url in urls if isinstance(url, str) and url.startswith(base)]
          json.dump({'keys': keys}, open('cleanup.json', 'w', encoding='utf-8'))
          json.dump({
              'packageId': source['id'],
              'schemaVersion': 1,
              'submissionIssue': int(sys.argv[1]),
          }, open('provenance.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY
          sha256sum candidate.json cleanup.json provenance.json scan-report.json > validated.sha256
          if test -d normalized-media; then find normalized-media -type f -print0 | sort -z | xargs -0 sha256sum >> validated.sha256; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-submission-${{ github.run_id }}
          path: |
            candidate.json
            cleanup.json
            normalized-media
            provenance.json
            scan-report.json
            validated.sha256
          if-no-files-found: error
          retention-days: 1

  write:
    needs: validate
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-submission-${{ github.run_id }}
          path: validated
      - name: Recheck validated data and open audited manifest PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd validated
          sha256sum --check validated.sha256
          id=$(jq -r .id candidate.json)
          version=$(jq -r .version candidate.json)
          [[ "$id" =~ ^[a-z0-9][a-z0-9._-]{1,63}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          test "$(jq -r .schemaVersion provenance.json)" = 1
          test "$(jq -r .packageId provenance.json)" = "$id"
          [[ "$(jq -r .submissionIssue provenance.json)" =~ ^[1-9][0-9]*$ ]]
          if test -d normalized-media; then
            test "$(find normalized-media -type f | wc -l | tr -d ' ')" -le 11
            find normalized-media -type f -not -path "normalized-media/$id/*" -print -quit | grep -q . && exit 1 || true
          fi
          cd ..
          gh label create vanahub-submission --repo "${{ github.repository }}" --color 1f6feb --description "VanaHub catalog admission request" --force
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label vanahub-submission
          gh auth setup-git
          branch="automation/${id}/${version}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch" origin/main
          mkdir -p "packages/$id"
          cp validated/candidate.json "packages/$id/manifest.json"
          cp validated/provenance.json "packages/$id/provenance.json"
          if test -d "validated/normalized-media/$id"; then mkdir -p "media/$id"; cp validated/normalized-media/$id/*.jpg "media/$id/"; fi
          git add "packages/$id/manifest.json" "packages/$id/provenance.json"
          if test -d "media/$id"; then git add "media/$id"; fi
          if git diff --cached --quiet; then
            gh issue comment "${{ github.event.issue.number }}" --body "The catalog already contains $id $version. Future stable releases will be discovered automatically."
            exit 0
          fi
          git commit -m "Publish $id $version"
          head_sha=$(git rev-parse HEAD)
          git push --force-with-lease --set-upstream origin "$branch"
          number=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            url=$(gh pr create --base main --head "$branch" --title "Publish $id $version" --body "Automated from #${{ github.event.issue.number }} after source authorization and artifact validation.")
            number=$(gh pr view "$url" --json number --jq .number)
          fi
          raw_base="https://raw.githubusercontent.com/${{ github.repository }}/${head_sha}/media"
          python3 scripts/render_media_preview.py "packages/$id/manifest.json" preview.md \
            --catalog-base https://hildaware.github.io/vanahub-catalog/media \
            --raw-base "$raw_base"
          if test -s preview.md; then gh issue comment "${{ github.event.issue.number }}" --body-file preview.md; fi
          gh issue comment "${{ github.event.issue.number }}" --body "Prepared catalog PR #${number}. Admission will re-verify the release and normalized media before merge."
          python3 scripts/post_scan_report.py validated/scan-report.json validated/provenance.json \
            --repository "${{ github.repository }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --pull-request "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Best-effort staged media cleanup
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          VH_CLEANUP_SECRET: ${{ secrets.VANAHUB_MEDIA_CLEANUP_SECRET }}
          VH_CLEANUP_URL: ${{ vars.VANAHUB_SCREENSHOT_UPLOAD_URL }}
        run: |
          test -n "$VH_CLEANUP_SECRET"
          test "$(jq '.keys | length' validated/cleanup.json)" -eq 0 && exit 0
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VH_CLEANUP_SECRET" \
            -H 'Content-Type: application/json' \
            --data @validated/cleanup.json \
            "${VH_CLEANUP_URL%/}/cleanup"
      - name: Dispatch admission for the exact head
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: gh workflow run admission.yml --ref main -f pr_number="$PR_NUMBER" -f expected_head_sha="$HEAD_SHA"

  notify-failure:
    needs: validate
    if: always() && needs.validate.result == 'failure'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Catalog validation or media moderation failed. Review the linked workflow log, replace the reported media, publish a corrected release, and reopen this issue to retry. No submitted image was published."
