name: Prepare catalog profile

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: Lowercase catalog profile ID.
        required: true
        type: string
      version:
        description: New profile SemVer.
        required: true
        type: string
      description:
        description: Public profile description.
        required: true
        type: string
      author:
        description: Public profile author.
        required: true
        type: string
      categories:
        description: Optional comma-separated catalog categories (maximum three).
        required: false
        type: string
      confirm_public:
        description: I reviewed these settings and intend to publish a sanitized profile publicly.
        required: true
        type: boolean

concurrency:
  group: profile-${{ inputs.profile_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  scan:
    if: inputs.confirm_public == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: 0134d271197ca7d2a9cb1d59019cc840c329baa0
          path: product
          persist-credentials: false
      - name: Build shared settings scanner
        run: |
          cmake -S product -B product/build/profile -DVH_BUILD_ENGINE=OFF -DVH_BUILD_TESTS=OFF
          cmake --build product/build/profile --target vanahub_settings_scan
      - name: Validate and sanitize the draft asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VH_ID: ${{ inputs.profile_id }}
          VH_VERSION: ${{ inputs.version }}
          VH_DESCRIPTION: ${{ inputs.description }}
          VH_AUTHOR: ${{ inputs.author }}
          VH_CATEGORIES: ${{ inputs.categories }}
          VH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VH_ID" =~ ^[a-z0-9][a-z0-9._-]{1,63}$ ]]
          [[ "$VH_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          tag="profile-$VH_ID-v$VH_VERSION"
          source_asset="$VH_ID-$VH_VERSION.source.vanahub-profile.zip"
          canonical_asset="$VH_ID-$VH_VERSION.vanahub-profile.zip"
          details=$(gh release view "$tag" --repo "$VH_REPOSITORY" --json isDraft,isPrerelease)
          test "$(jq -r .isDraft <<< "$details")" = true
          test "$(jq -r .isPrerelease <<< "$details")" = false
          mkdir -p source validated
          gh release download "$tag" --repo "$VH_REPOSITORY" --pattern "$source_asset" --dir source
          download_url="https://github.com/$VH_REPOSITORY/releases/download/$tag/$canonical_asset"
          python3 product/tools/profile_scan.py prepare \
            "source/$source_asset" "validated/$canonical_asset" validated/manifest.json \
            --report validated/report.json --id "$VH_ID" --version "$VH_VERSION" \
            --description "$VH_DESCRIPTION" --author "$VH_AUTHOR" \
            --categories "$VH_CATEGORIES" --download-url "$download_url" \
            --settings-scanner product/build/profile/vanahub_settings_scan
          python3 scripts/render_profile_report.py validated/report.json validated/report.md
          cd validated
          sha256sum manifest.json report.json report.md "$canonical_asset" > validated.sha256
          cd ..
          cat validated/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-profile-${{ github.run_id }}
          path: validated
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: scan
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-profile-${{ github.run_id }}
          path: validated
      - name: Replace the source asset with the reviewed sanitized archive
        env:
          GH_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd validated
          sha256sum --check validated.sha256
          id=$(jq -r .id manifest.json)
          version=$(jq -r .version manifest.json)
          tag="profile-$id-v$version"
          source_asset="$id-$version.source.vanahub-profile.zip"
          canonical_asset="$id-$version.vanahub-profile.zip"
          gh release upload "$tag" "$canonical_asset" --repo "$VH_REPOSITORY" --clobber
          mkdir ../uploaded
          gh release download "$tag" --repo "$VH_REPOSITORY" --pattern "$canonical_asset" --dir ../uploaded
          cmp "$canonical_asset" "../uploaded/$canonical_asset"
          gh release delete-asset "$tag" "$source_asset" --repo "$VH_REPOSITORY" --yes

  write:
    needs: stage
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-profile-${{ github.run_id }}
          path: validated
      - name: Open an audited profile PR
        env:
          GH_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd validated
          sha256sum --check validated.sha256
          cd ..
          id=$(jq -r .id validated/manifest.json)
          version=$(jq -r .version validated/manifest.json)
          branch="automation/profile/$id/$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch" origin/main
          mkdir -p "profiles/$id"
          cp validated/manifest.json "profiles/$id/manifest.json"
          git add "profiles/$id/manifest.json"
          git commit -m "Publish profile $id $version"
          head_sha=$(git rev-parse HEAD)
          gh auth setup-git
          git push --force-with-lease --set-upstream origin "$branch"
          {
            echo 'Validated a sanitized profile archive. Approving this exact PR head starts independent admission; the release remains private until the approved change merges and the signed catalog is ready.'
            echo
            cat validated/report.md
          } > validated/pr-body.md
          number=$(gh pr list --repo "$VH_REPOSITORY" --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            url=$(gh pr create --repo "$VH_REPOSITORY" --base main --head "$branch" --title "Publish profile $id $version" --body-file validated/pr-body.md)
            number=$(gh pr view "$url" --repo "$VH_REPOSITORY" --json number --jq .number)
          else
            gh pr edit "$number" --repo "$VH_REPOSITORY" --body-file validated/pr-body.md
          fi
