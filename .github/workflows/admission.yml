name: Catalog admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request created by trusted catalog automation.
        required: true
        type: number
      expected_head_sha:
        description: Exact automation commit validated by the preparation workflow.
        required: true
        type: string

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      accepted: ${{ steps.scan.outcome == 'success' || steps.automated_scan.outcome == 'success' }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      report_available: ${{ steps.report.outputs.available }}
    steps:
      - name: Resolve pull request context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          VH_EVENT_PR: ${{ github.event.pull_request.number }}
          VH_INPUT_PR: ${{ inputs.pr_number }}
          VH_REPOSITORY: ${{ github.repository }}
          VH_EVENT_NAME: ${{ github.event_name }}
          VH_EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          pr="${VH_INPUT_PR:-$VH_EVENT_PR}"
          test -n "$pr"
          details=$(gh pr view "$pr" --repo "$VH_REPOSITORY" --json author,baseRefOid,headRefName,headRefOid,headRepositoryOwner)
          actor=$(jq -r .author.login <<< "$details")
          head=$(jq -r .headRefName <<< "$details")
          owner=$(jq -r .headRepositoryOwner.login <<< "$details")
          resolved_head=$(jq -r .headRefOid <<< "$details")
          automated=false
          if [[ "$owner" == "${VH_REPOSITORY%%/*}" && \
                "$head" == automation/* && \
                "$actor" == "app/github-actions" ]]; then
            if [[ "$VH_EVENT_NAME" == "pull_request_target" || \
                  ("$resolved_head" == "$VH_EXPECTED_HEAD" && "$VH_EXPECTED_HEAD" =~ ^[0-9a-f]{40}$) ]]; then
              automated=true
            fi
          fi
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r .baseRefOid <<< "$details")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .headRefOid <<< "$details")" >> "$GITHUB_OUTPUT"
          echo "actor=$actor" >> "$GITHUB_OUTPUT"
          echo "automated=$automated" >> "$GITHUB_OUTPUT"
      - name: Check out trusted catalog workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.context.outputs.base_sha }}
          path: catalog-base
          persist-credentials: false
      - name: Check out pinned scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub
          ref: d85cfa6083b0101ce637e386637ad115dcc2479c
          path: product
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned semantic scanner
        run: python3 -m pip install --disable-pip-version-check --quiet semgrep==1.175.0
      - name: Obtain and constrain changed manifest as data
        env:
          GH_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
          VH_PR: ${{ steps.context.outputs.pr_number }}
          VH_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --requirement catalog-base/requirements-image.txt
          gh api --paginate "repos/${VH_REPOSITORY}/pulls/${VH_PR}/files" > changed.json
          media=()
          if [[ "${{ steps.context.outputs.automated }}" == "true" ]]; then media+=(--allow-media --allow-provenance); fi
          python3 catalog-base/scripts/extract_pr_manifest.py changed.json "$VH_REPOSITORY" "$VH_HEAD_SHA" manifest.json "${media[@]}"
          if [[ "${{ steps.context.outputs.automated }}" == "true" ]]; then
            id=$(jq -er .id manifest.json)
            if gh api "repos/${VH_REPOSITORY}/contents/packages/$id/provenance.json?ref=${VH_HEAD_SHA}" --jq .content | base64 --decode > provenance.json 2>/dev/null; then :; else rm -f provenance.json; fi
          fi
      - name: Verify and scan
        id: scan
        if: steps.context.outputs.automated != 'true'
        uses: ./product/.github/actions/catalog-scan
        with:
          manifest: manifest.json
          actor: ${{ steps.context.outputs.actor }}
          output: scan-report.json
          previous-root: catalog-base/packages
          review-root: catalog-base/reviews
          semantic-output: semantic-review
          token: ${{ github.token }}
      - name: Re-verify and scan catalog automation
        id: automated_scan
        if: steps.context.outputs.automated == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(catalog-base/scripts/verify_automated.py manifest.json --previous-root catalog-base/packages)
          if [[ -f provenance.json ]]; then args+=(--provenance provenance.json); fi
          python3 "${args[@]}"
          scan_manifest=manifest.json
          if [[ -f provenance.json && "$(jq -r '.distributionMethod // empty' provenance.json)" == "vanahub-build" ]]; then
            jq '.sourceUrl = "https://github.com/Hildaware/vanahub-addon-distro"' manifest.json > scan-manifest.json
            scan_manifest=scan-manifest.json
          fi
          bash product/tools/scan_catalog_package.sh \
            "$scan_manifest" scan-report.json catalog-base/reviews semantic-review
      - name: Detect a completed scan report
        id: report
        if: always()
        run: if test -s scan-report.json; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.report.outputs.available == 'true'
        with:
          name: rejected-scan-report
          path: scan-report.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('semantic-review/semantic-review.json') != ''
        with:
          name: semantic-review-admission
          path: semantic-review
          retention-days: 7

  accept:
    needs: scan
    if: needs.scan.outputs.accepted == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable protected auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          VH_REPOSITORY: ${{ github.repository }}
          VH_PR: ${{ needs.scan.outputs.pr_number }}
          VH_HEAD_SHA: ${{ needs.scan.outputs.head_sha }}
        run: gh pr merge "$VH_PR" --repo "$VH_REPOSITORY" --auto --squash --match-head-commit "$VH_HEAD_SHA"
      - name: Record the exact admitted change
        env:
          VH_PR: ${{ needs.scan.outputs.pr_number }}
          VH_HEAD_SHA: ${{ needs.scan.outputs.head_sha }}
        run: |
          jq -n --argjson pr "$VH_PR" --arg head "$VH_HEAD_SHA" \
            '{prNumber: $pr, headSha: $head}' > admitted-change.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admitted-catalog-change
          path: admitted-change.json
          if-no-files-found: error
          retention-days: 1

  report-rejection:
    needs: scan
    if: always() && needs.scan.result == 'failure' && needs.scan.outputs.report_available == 'true'
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rejected-scan-report
          path: rejected
      - name: Report rejection to the originating submission issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(jq -r .packageId rejected/scan-report.json)
          provenance="packages/$id/provenance.json"
          test -f "$provenance"
          python3 scripts/post_scan_report.py rejected/scan-report.json "$provenance" \
            --repository "${{ github.repository }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
