name: Distribution contract tests

on:
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/community_distribution.py
      - tests/test_community_distribution.py
      - tests/test_distribution_pipeline.py
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run trusted-distribution contracts
        run: |
          python3 -m unittest tests.test_community_distribution tests.test_distribution_pipeline tests.test_semantic_workflows -v
          python3 -m py_compile scripts/*.py
